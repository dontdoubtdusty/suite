<style>
/* ===== Theme ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#fff7f0;--card:#fff;--fld:#fff0e2;--tx:#2b1c10;--mu:#8a6c58;--ac:#17a65a;--bd:#f5e0cf;--neg:#e8295b;--wn:#f08c00;--pc:#ff7a00;--pc2:#ffa53d;--brand:#ff7a00;--gl:10%;--tst:#2b1c10;--sh:0 1px 2px rgba(60,30,10,.05),0 10px 24px -14px rgba(60,30,10,.22);--fast:.16s;--fd:'Fredoka','Nunito',system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a130d;--card:#261c14;--fld:#33261b;--tx:#fdf2e8;--mu:#c2a690;--ac:#3ddc84;--bd:#3f3024;--neg:#ff5c85;--wn:#ffb020;--sh:0 10px 24px -16px rgba(0,0,0,.7);--gl:20%;--tst:#3f3024}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh)}

/* ===== Base ===== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 440px at 50% -140px,color-mix(in srgb,var(--pc) var(--gl),transparent),transparent 72%) no-repeat,var(--bg);color:var(--tx);font:500 15px/1.45 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}input,select,button,b{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:12px}
/* Clips the page while it slides sideways, so it can never widen the viewport (which made the fixed nav twitch on iOS) */
.vclip{overflow:hidden;width:100%}
.view{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;touch-action:pan-y}
.view>.seg,.view>h2,.view>button,.view>p,.view>.tiles,.view>.wide,.view>.warn,.view>.pcb{grid-column:1/-1}
.view>h2{margin:8px 2px 0}
h2,h3{margin:0 0 10px;font-family:var(--fd);font-weight:600}h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--neg)}.pos{color:var(--ac)}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:2px 0 6px}
.ic{display:inline-block;vertical-align:-2px}

/* ===== Cards & rows ===== */
.card,.tile{border-radius:22px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);padding:16px}
.view>.card{background-image:linear-gradient(90deg,var(--pc),var(--pc2));background-size:100% 5px;background-repeat:no-repeat;background-origin:border-box;padding-top:19px}.card h2{color:var(--pc)}
.row{display:flex;gap:8px;align-items:center;margin:2px 0;min-height:38px}.row>*{min-width:0}.row>.mu{flex:none}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln b{font-weight:600;white-space:nowrap}
.tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);border-radius:99px;padding:3px 8px;text-transform:uppercase}
.bar{height:8px;background:var(--fld);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),var(--pc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.warn{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--card))}.warn h3{color:var(--wn)}.warn .row button{padding:5px 10px;font-size:13px}

/* ===== Inputs & buttons ===== */
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color var(--fast),background var(--fast)}
.row input[type=text],.row input[type=number],.row input[type=date],.row select{padding:7px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
/* Checkboxes with a little pop when ticked */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;margin:0;border:2px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:8px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;transition:background var(--fast),border-color var(--fast)}
input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent}input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox].pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.22)}}
button{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent);transition:transform .25s var(--bounce),filter .1s,background var(--fast)}
button.g,button.x,nav button,.seg button,.gear,#toast button,.warn .row button{box-shadow:none}
button:is(:active,.prs){transform:scale(.93);filter:brightness(.95);transition-duration:.08s}
button:disabled{opacity:.4}
button.g{background:none;color:var(--mu);padding:8px 10px;font-weight:600}button.x{background:none;color:var(--neg);padding:8px 8px;font-weight:600}
button.bd{border:1px solid var(--bd);color:var(--tx)}button.x.bd{color:var(--neg)}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.seg.qm button{border-radius:999px;padding:9px 6px}.seg.qm button.on{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent)}

/* ===== Header & bottom nav ===== */
.top{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--tx);border-bottom:1px solid var(--bd);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));font:600 20px/1.2 var(--fd);letter-spacing:-.2px;text-align:center}
.top .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 44px;white-space:nowrap}.top .logo{flex:none;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jz{background:linear-gradient(90deg,#ffa53d,#ff7a00 55%,#ff4d4d);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:10px;bottom:7px;background:none;color:var(--mu);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}.gear.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:7px 0 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;z-index:1;transition:color .25s}
nav button>span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
nav button.on{color:var(--tc)}nav button:is(:active,.prs){transform:none;filter:none}
.ni{flex:none;width:24px;height:24px}
/* One small highlight pill that sits behind the active tab's icon only and glides between tabs; the buttons themselves never move */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,#ff7a00) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
/* Neighbouring tab shown beside the current one while swiping */
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
#peek>.view{max-width:1100px;margin:0 auto;padding:12px}

/* ===== Toast & popup ===== */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tst);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;color:#ffb020;padding:6px 10px;font-weight:800}
#dlg{position:fixed;inset:0;z-index:35;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(22,12,4,.45);animation:dfade .18s ease-out}
#dlg[hidden]{display:none}
.dbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dup .28s cubic-bezier(.16,1,.3,1)}
.dbox h3{margin:0 0 6px;font:600 20px/1.2 var(--fd);color:var(--tx)}.dbox p{margin:0 0 16px;font-size:14px}
.dbtns{display:flex;flex-direction:column;gap:8px}.dbtns button{width:100%;padding:12px 16px}
@media(min-width:600px){#dlg{place-items:center}}
@keyframes dfade{from{opacity:0}}@keyframes dup{from{transform:translateY(28px);opacity:0}}

/* ===== Greeting & hero ===== */
.view>.hello{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 4px -2px}
.hello b{font:600 25px/1.2 var(--fd)}.hello span{flex:none;font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px}
.pcb{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--pc) 70%,transparent)}
.pcb:before,.pcb:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c;pointer-events:none}.pcb:before{left:-50px;bottom:-80px;width:180px;height:180px}.pcb:after{right:-40px;top:-60px;width:140px;height:140px;background:#ffffff14}.pcb>*{position:relative;z-index:1}
.pcb b{display:block;font:600 34px/1.1 var(--fd)}.pcb span{font-size:13px;opacity:.9}

/* ===== Drag to reorder ===== */
.dh{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:34px;margin-left:-6px;color:var(--mu);opacity:.45;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.dh:is(:active,.prs){cursor:grabbing}
.dragging{position:relative;z-index:20;background:var(--card);border-radius:10px;box-shadow:0 10px 24px rgba(16,24,40,.18),0 0 0 1px var(--bd);transition:box-shadow .15s}.dragging .dh{opacity:1;color:var(--pc)}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ===== App cards on Home ===== */
/* Each card is tinted with its own app's colors (set inline as --pc / --pc2) */
.acard{cursor:pointer;transition:transform .25s var(--bounce),border-color var(--fast)}
.acard:is(:active,.prs){transform:scale(.97);transition-duration:.08s}
.acard:focus-visible{outline:none;border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}
.acard h3{justify-content:flex-start;margin-bottom:8px}
.an{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.an>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.an em{font-style:normal;font-weight:500;color:var(--mu)}
.acard .big{display:block;font:600 24px/1.2 var(--fd);margin:0 0 2px;overflow-wrap:anywhere}
.acard .lns{margin-top:8px;border-top:1px solid var(--bd);padding-top:6px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%,transparent)}
.chev{flex:none;color:var(--mu)}
.src{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:700;color:var(--mu)}

/* ===== App list ===== */
.arow{display:flex;align-items:center;gap:4px;padding:4px 0;border-top:1px solid var(--bd)}.arow:first-of-type{border-top:0}
.aopen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;color:var(--tx);box-shadow:none;padding:6px 4px;text-align:left;font-weight:600;border-radius:14px}
.aopen:is(:active,.prs){transform:scale(.97)}
.aopen img{flex:none;width:52px;height:52px;border-radius:14px;box-shadow:0 4px 10px -6px rgba(0,0,0,.4)}
.aopen>span{min-width:0}.aopen b{display:block;font:600 17px/1.2 var(--fd)}.aopen b em{font-style:normal;font-weight:500;color:var(--mu)}
.aopen small{display:block;font-size:13px;font-weight:600;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext{flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;color:var(--mu)}
.ext:is(:active,.prs){background:var(--fld)}
.hrow .an{font-weight:600}

/* ===== App viewer ===== */
/* An app opened inside the suite fills the screen; the bar on top takes you back */
#vw{position:fixed;inset:0;z-index:32;display:flex;flex-direction:column;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);animation:vup .3s cubic-bezier(.16,1,.3,1)}
#vw[hidden]{display:none}
.vbar{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(5px + env(safe-area-inset-top,0px)) 6px 5px;background:var(--card);border-bottom:1px solid var(--bd)}
.vbar .vback{display:flex;align-items:center;gap:2px;color:var(--brand);font-weight:800;padding:8px 10px 8px 4px;z-index:1}
.vbar .vt{position:absolute;left:0;right:0;bottom:5px;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 16px/1 var(--fd);pointer-events:none}
.vbar .ext{z-index:1}
#vw iframe{flex:1;display:block;width:100%;border:0;background:var(--bg)}
body.vopen{overflow:hidden}
@keyframes vup{from{transform:translateY(32px);opacity:0}}

@media(prefers-reduced-motion:reduce){*,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

// ---- Minimal DOM diff: update only what changed, so typing focus, open sections and scroll stay put ----
function morphNode(a,b){

 B.forEach((n,i)=>i<A.length?morphNode(A[i],n):a.appendChild(n));for(let i=B.length;i<A.length;i++)A[i].remove()}

(function(){let sx=0,sy=0,lx=0,lt=0,vx=0,ax=null,ok=false,busy=false;const W=()=>innerWidth,nav=()=>document.getElementById('nav');
